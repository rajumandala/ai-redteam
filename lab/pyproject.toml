[project]
name = "redteam-lab"
version = "0.1.0"
description = "Lab target and harness for Part R: AI red teaming"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.100",
    "pydantic>=2.11",
    "python-dotenv>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redteam"]
